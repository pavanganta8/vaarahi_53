version: 2

models:
  - name: dim_customers
    description: "Cleansed dimension table for customers."
    columns:
      - name: customer_id
        description: "Primary key for customer dimension."
        tests:
          - unique:
              config:
                severity: error # Fails the test and blocks downstream steps
          - not_null

  - name: fact_orders
    description: "Transaction facts representing orders."
    columns:
      - name: order_id
        description: "Primary key for orders table."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key referencing dim_customers."
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: status
        description: "Current processing status of the order."
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']
              config:
                severity: warn # Triggers warning rather than error, showing student how warning thresholds work
